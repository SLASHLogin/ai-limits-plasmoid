name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  helper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run helper tests
        run: python3 tests/test_helper.py
      - name: Validate package metadata and configuration XML
        run: |
          python3 -m json.tool package/metadata.json >/dev/null
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("package/contents/config/main.xml")
          PY
